<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header id="header">
        <nav>
            <div class="logo">
                <h1><span class="white">Fit</span><span class="yellow">Track</span></h1>
            </div>

            <div id="menu">
                <a href="index.html">Inicio</a>
                <a href="sobre.html">Sobre</a>
                <a href="recursos.html">Recursos</a>
                <a href="Contato.html">Contato</a>
                <a href="entrar.html">Entrar</a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Cadastro</h1>
            <p>Crie sua conta e comece sua jornada com mais organização e foco.</p>

            <form class="auth-form">
                <div class="form-group">
                    <label for="usuario">Seu nome</label>
                    <input type="text" id="usuario" placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label for="password">Sua senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha">
                </div>

                <div class="form-group">
                    <label for="newpassword">Confirme sua senha</label>
                    <input type="password" id="newpassword" placeholder="Confirme sua senha">
                </div>

                <button type="submit" class="btn auth-btn">Concluir</button>
            </form>
        </section>
    </main>

    <footer id="footer">
        <p>&copy; 2026 FitTrack. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
